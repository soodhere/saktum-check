name: Saktum Check
description: Test an MCP server for trust, functional behaviour, performance and agent readiness, with a signed result.
author: Saktum
branding: { icon: shield, color: purple }
inputs:
  target:
    description: 'The server: "-- <command that starts it>" (for example "-- node build/index.js") or an https URL'
    required: true
  args:
    description: 'Extra options, for example "--active --tests saktum.tests.yaml" (only use --active against your own server)'
    required: false
    default: ""
  fail-on:
    description: Fail the job on findings at or above this severity (critical, high, medium, low)
    required: false
    default: high
  sarif:
    description: 'Upload findings to GitHub code scanning (needs "permissions: security-events: write" in your workflow)'
    required: false
    default: "false"
  baseline:
    description: Path of a baseline file (fail only on new findings); create it once with "--baseline file --update-baseline"
    required: false
    default: ""
  policy:
    description: Path of your organisation's policy file (saktum-policy.yaml); the job fails if the server violates it
    required: false
    default: ""
  version:
    description: Saktum Check version from npm
    required: false
    default: latest
outputs:
  report:
    description: Path of the signed JSON result
    value: saktum-report.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: 22 }
    - name: Run Saktum Check
      shell: bash
      env: { TARGET: "${{ inputs.target }}", ARGS: "${{ inputs.args }}", FAIL_ON: "${{ inputs.fail-on }}", VERSION: "${{ inputs.version }}", SARIF: "${{ inputs.sarif }}", BASELINE: "${{ inputs.baseline }}", POLICY: "${{ inputs.policy }}" }
      run: |
        set -f
        eval "set -- $ARGS $TARGET"
        set +e
        EXTRA=""
        if [ "$SARIF" = "true" ]; then EXTRA="$EXTRA --sarif saktum.sarif"; fi
        if [ -n "$BASELINE" ]; then EXTRA="$EXTRA --baseline $BASELINE"; fi
        if [ -n "$POLICY" ]; then EXTRA="$EXTRA --policy $POLICY"; fi
        npx -y "saktum@${VERSION}" check --out saktum-report.json --html saktum-report.html --badge saktum-badge.svg --fail-on "$FAIL_ON" $EXTRA "$@" > saktum-report.txt 2>&1
        CODE=$?
        set -e
        { echo '## Saktum Check'; echo; echo '```'; head -c 60000 saktum-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        cat saktum-report.txt
        exit $CODE
    - uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
      if: always() && inputs.sarif == 'true' && hashFiles('saktum.sarif') != ''
      with: { sarif_file: saktum.sarif, category: saktum-check }
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with: { name: saktum-report, path: "saktum-report.json\nsaktum-report.html\nsaktum-badge.svg\nsaktum-report.txt", if-no-files-found: ignore }
