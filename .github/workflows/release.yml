# Release: push a tag like v0.1.0. Runs every test, builds saktum.mjs, smoke-tests it, attaches it to a GitHub Release,
# and (when the NPM_TOKEN secret is set) publishes the "saktum" package to npm with provenance, so `npx saktum` works.
name: release
on:
  push:
    tags: ["v*"]
  # Web-only releases: Actions > release > Run workflow, enter the version (for example v0.1.0).
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release, for example v0.1.0"
        required: true
        default: "v0.1.0"
permissions:
  contents: write
  id-token: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point links at this repository (no manual editing needed)
        run: sed -i "s#OWNER/saktum-check#${GITHUB_REPOSITORY}#g" npm/package.json packages/report/src/index.ts docs/QUICKSTART.md
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm bundle
      - name: SBOM (CycloneDX) for the bundled dependencies
        run: node scripts/sbom.mjs dist-bundle/saktum.sbom.cdx.json
      - name: Smoke-test the bundle from an empty directory
        run: |
          mkdir /tmp/smoke && cp dist-bundle/saktum.mjs /tmp/smoke/ && cd /tmp/smoke
          node saktum.mjs --version
          node saktum.mjs doctor
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the bundle (Sigstore, keyless via GitHub OIDC)
        run: cosign sign-blob --yes --bundle dist-bundle/saktum.mjs.sigstore.json dist-bundle/saktum.mjs
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bundle/saktum.mjs dist-bundle/saktum.mjs.sha256 dist-bundle/saktum.sbom.cdx.json dist-bundle/saktum.mjs.sigstore.json --clobber
          else
            gh release create "$TAG" dist-bundle/saktum.mjs dist-bundle/saktum.mjs.sha256 dist-bundle/saktum.sbom.cdx.json dist-bundle/saktum.mjs.sigstore.json --target "$GITHUB_SHA" \
              --title "Saktum Check $TAG" --notes-file docs/QUICKSTART.md --prerelease
          fi
      - name: Publish to npm with provenance
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cp dist-bundle/saktum.mjs README.md LICENSE npm/
          cd npm
          test "v$(node -p "require('./package.json').version")" = "$TAG" || { echo "npm/package.json version must match the tag"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
